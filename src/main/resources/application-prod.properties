scheduler.security.mode=jwt
scheduler.security.issuer-uri=${OIDC_ISSUER_URI}
scheduler.security.jwk-set-uri=${OIDC_JWK_SET_URI:}
scheduler.security.audience=${OIDC_AUDIENCE:scheduler-api}
scheduler.targets.fake-enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
logging.structured.format.console=ecs
