# Safe default: deny all except cluster DNS. Add explicit ingress from your
# gateway/monitoring and egress to PostgreSQL, OIDC/JWKS and registered destinations
# using your CNI's supported IP/FQDN policies BEFORE deploying workers.
# Do not open arbitrary internet egress: DNS validation alone is not SSRF isolation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scheduler-default-deny
spec:
  podSelector:
    matchLabels: {app: scheduler}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
